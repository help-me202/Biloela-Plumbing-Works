<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@300;400;500;700;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../CSS/payment.css" />
    <link rel="stylesheet" href="../CSS/footer-layout.css" />
    <style>
      body {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }
      .site-footer {
        margin-top: auto;
      }
    </style>
    <title>Payment — Biloela Plumbing Works</title>
  </head>
  <body>
    <main class="container">
      <h1>Make a Payment</h1>

      <form id="payment-form" novalidate>
        <div class="row">
          <label for="name">Full name</label>
          <input
            id="name"
            name="name"
            type="text"
            required
            placeholder="Jane Doe"
          />
        </div>

        <div class="row">
          <label for="email">Email</label>
          <input
            id="email"
            name="email"
            type="email"
            required
            placeholder="you@example.com"
          />
        </div>

        <div class="row">
          <label for="amount">Amount (AUD)</label>
          <input
            id="amount"
            name="amount"
            type="number"
            min="0"
            step="0.01"
            required
            value="50.00"
            disabled
          />
        </div>

        <div class="actions">
          <button id="pay-btn" type="submit">Proceed to Secure Payment</button>
        </div>

        <div id="message" role="status" aria-live="polite"></div>
      </form>
    </main>

    <script src="../JSON/payment.js"></script>
    <footer class="site-footer">
      <p>Biloela Plumbing Works Pty Ltd, &copy; 2026 All rights reserved.</p>
      <p>ABN: 61 137 850 769</p>
    </footer>
  </body>
</html>
